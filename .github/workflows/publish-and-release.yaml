name: Publish and release
on:
  workflow_run:
    workflows: [ "Artifacts" ]
    branches:
      - master
    types:
      - completed
  workflow_dispatch:

# A Go module is consumed straight from the repository, so there is no artifact
# to build or deploy. This workflow tags the commit with a pre-release version
# of BASE_VERSION that the Go tooling recognises, and publishes a release for
# it.
env:
  BASE_VERSION: "0.3.0"

jobs:
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-20.04
    outputs:
      VERSION: "v${{ env.BASE_VERSION }}-${{ github.run_id }}-${{ github.run_number }}-${{ steps.short-sha.outputs.sha }}"
    steps:
      - name: Parse short sha
        uses: benjlevesque/short-sha@v1.2
        id: short-sha
  draft-release:
    runs-on: ubuntu-20.04
    needs: [ prepare ]
    env:
      VERSION: "${{ needs.prepare.outputs.VERSION }}"
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Retrieve license obligation resources
        run: |
          find . -regex '.*3RD-PARTY-LICENSES' -type d -not -regex '.*target.*' | \
          awk '{split($0,a,"3RD-PARTY-LICENSES"); system("cd " $0 " && find . -type d -maxdepth 1 -not -path . | zip -r@ \"$(cat module.name)-3rd-party-copyrights\" && cd -")}'
          find . -iname origin.src -regex '.*3RD-PARTY-LICENSES.*' -not -regex '.*target.*' | \
          awk '{ \
          split($0,a,"3RD-PARTY-LICENSES"); \
          split(a[2],b,"/"); \
          system("xargs < " $0 " curl --create-dirs -Lo " a[1] "/3RD-PARTY-LICENSES/sources/" b[2] ".zip " $2)}' && \
          find -regex '.*3RD-PARTY-LICENSES/sources$' | awk '{system("zip -jr " $0 "/../$(cat "$0"/../module.name)-3rd-party-sources.zip " $0)}'
          mkdir -p license-obligations
          find . -name "*-3rd-party-*.zip" -not -path "./license-obligations/*" -exec mv {} license-obligations/ \;
      - name: Generate change log
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          ./.github/scripts/generate-changelog.sh
      - name: Create release tag
        run: |
          git tag ${{ env.VERSION }}
          git push --tags
      - name: Create draft
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          draft: true
          bodyFile: /tmp/cs.repository-changelog.${{ env.VERSION }}
          artifacts: "license-obligations/*"
  publish:
    runs-on: ubuntu-20.04
    needs: [ prepare,draft-release ]
    env:
      VERSION: "${{ needs.prepare.outputs.VERSION }}"
    steps:
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          allowUpdates: true
          draft: false
          omitBodyDuringUpdate: true
