name: Artifacts
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
jobs:
  verification:
    runs-on: ubuntu-20.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
      - name: Verify changed files
        uses: pre-commit/action@v2.0.3
  build:
    runs-on: ubuntu-20.04
    needs: verification
    strategy:
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
  test:
    runs-on: ubuntu-20.04
    needs: verification
    strategy:
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Run Tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v2
        if: matrix.go == '1.27'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          name: codecov
